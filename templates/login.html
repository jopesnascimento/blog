{% extends "base.html" %} {% block title %}Login{% endblock %} {% block content
%}
<div class="container mx-auto px-4 py-16 max-w-sm">
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-8">
    <h1
      class="text-2xl font-bold text-center mb-6 text-gray-900 dark:text-white"
    >
      🔐 Entrar
    </h1>

    {% if erro %}
    <div
      class="bg-red-50 dark:bg-red-900/30 border-l-4 border-red-500 p-3 mb-4 rounded"
    >
      <p class="text-red-700 dark:text-red-400 text-sm">{{ erro }}</p>
    </div>
    {% endif %}

    <form action="/login" method="POST">
      <div class="mb-4">
        <label class="block text-gray-700 dark:text-gray-300 font-bold mb-2">
          Usuário:
        </label>
        <input
          type="text"
          name="usuario"
          required
          autofocus
          class="w-full px-3 py-2 border dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:border-blue-500"
        />
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 dark:text-gray-300 font-bold mb-2">
          Senha:
        </label>
        <input
          type="password"
          name="senha"
          required
          class="w-full px-3 py-2 border dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:border-blue-500"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 dark:bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-700 dark:hover:bg-blue-600 font-bold"
      >
        Entrar
      </button>
    </form>

    <a
      href="/"
      class="text-blue-600 dark:text-blue-400 hover:underline mt-4 inline-block text-sm"
    >
      ← Voltar para o blog
    </a>
  </div>
</div>
{% endblock %}

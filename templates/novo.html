{% extends "base.html" %}

{% block title %}Meu Blog{% endblock %}

{% block content %}
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <h1 class="text-4xl font-bold mb-8">Criar Novo Post</h1>
        
        <form action="/criar" method="POST" class="bg-white rounded-lg shadow-md p-6">
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2">Titulo:</label>
                <input type="text" name="titulo" required
                class="w-full px-3 py-2 border rounded-lg focus:outline-none">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2">Conteudo: </label>
                <textarea name="conteudo" required rows="6"
                class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" ></textarea>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 font-bold mb-2">Autor: </label>
                <input type="text" name="autor" 
                class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
            </div>

            <button type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-bold">Publicar Post

            </button>
        
        <a href="/" class="text-blue-600 hover:underline mt-4 inline-block">← Voltar</a>
    </div>
{% endblock %}

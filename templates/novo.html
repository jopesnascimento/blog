{% extends "base.html" %} {% block title %}Novo Post{% endblock %} {% block
content %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
  <h1 class="text-4xl font-bold mb-8 text-gray-900 dark:text-white">
    Criar Novo Post
  </h1>

  {% if erros %}
  <div
    class="bg-red-50 dark:bg-red-900/30 border-l-4 border-red-500 p-4 mb-6 rounded"
  >
    {% for erro in erros %}
    <p class="text-red-700 dark:text-red-400 text-sm">⚠ {{ erro }}</p>
    {% endfor %}
  </div>
  {% endif %}

  <form
    action="/criar"
    method="POST"
    class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6"
  >
    <div class="mb-4">
      <label class="block text-gray-700 dark:text-gray-300 font-bold mb-2">
        Título:
      </label>
      <input
        type="text"
        name="titulo"
        value="{{ titulo or '' }}"
        maxlength="120"
        required
        class="w-full px-3 py-2 border dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:border-blue-500 dark:focus:border-blue-400"
      />
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 dark:text-gray-300 font-bold mb-2">
        Conteúdo:
      </label>
      <textarea
        name="conteudo"
        required
        rows="8"
        placeholder="Escreva seu post aqui..."
        class="w-full px-3 py-2 border dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:border-blue-500 dark:focus:border-blue-400"
      >{{ conteudo or '' }}</textarea>
    </div>

    <div class="mb-6">
      <label class="block text-gray-700 dark:text-gray-300 font-bold mb-2">
        Autor:
      </label>
      <input
        type="text"
        name="autor"
        value="{{ autor or '' }}"
        maxlength="60"
        required
        class="w-full px-3 py-2 border dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:border-blue-500 dark:focus:border-blue-400"
      />
    </div>

    <!-- 🔥 FEEDBACK DE ENVIO -->
    <button
      type="submit"
      onclick="this.innerText='Publicando...'; this.disabled=true;"
      class="w-full bg-blue-600 dark:bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-700 dark:hover:bg-blue-600 font-bold"
    >
      Publicar Post
    </button>
  </form>

  <!-- 🔙 VOLTAR -->
  <a
    href="/"
    class="text-blue-600 dark:text-blue-400 hover:underline mt-4 inline-block"
  >
    ← Voltar
  </a>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Meu Blog{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-4xl font-bold text-center mb-8 text-gray-900 dark:text-white">
        Meu Blog
    </h1>
    
    <div class="text-center mb-8">
        <a href="/novo" 
           class="bg-blue-600 dark:bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-700 dark:hover:bg-blue-600">
            Criar Novo Post
        </a>
    </div>

    {% for post in posts %}
    <article class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 mb-6">
        <h2 class="text-2xl font-bold mb-2">
            <a href="/post/{{ post.id }}" 
               class="text-blue-600 dark:text-blue-400 hover:underline">
                {{ post.titulo }}
            </a>
        </h2>
        <p class="text-gray-700 dark:text-gray-300 mb-4">{{ post.conteudo }}</p>
        <small class="text-gray-500 dark:text-gray-400">
            Por {{ post.autor }} • {{ post.data }}
        </small>
    </article>
    {% endfor %}
</div>
{% endblock %}

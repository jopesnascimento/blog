<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Blog</title>
    <link rel="shortcut icon" href="/templates/libro.png" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <div class="max-w-4xl mx-auto p-6">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold">Blog</h1>

        {% if logado %}
        <div class="flex gap-3">
          <a href="/novo" class="bg-blue-500 text-white px-4 py-2 rounded">
            Novo Post
          </a>

          <a href="/logout" class="text-red-500"> Sair </a>
        </div>
        {% else %}
        <a href="/login" class="text-blue-500">Login</a>
        {% endif %}
      </div>

      {% for post in posts %}
      <div class="bg-white p-6 rounded-lg shadow mb-6">
        <h2 class="text-2xl font-semibold">
          <a href="/post/{{ post._id }}"> {{ post.titulo }} </a>
        </h2>

        <p class="text-gray-500 text-sm mb-3">
          {{ post.autor }} • {{ post.data }}
        </p>

        {% if logado %}
        <div class="flex gap-4 mt-2">
          <a
            href="/editar/{{ post._id }}"
            class="text-blue-500 hover:underline"
          >
            Editar
          </a>

          <form action="/deletar/{{ post._id }}" method="POST">
            <button class="text-red-500 hover:underline">Deletar</button>
          </form>
        </div>
        {% endif %}
      </div>
      {% endfor %}
    </div>
  </body>
</html>

{% extends "base.html" %} {% block title %}{{ post.titulo }}{% endblock %} {%
block content %}
<div class="container mx-auto px-4 py-8 max-w-3xl">
  <article class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-8">
    <h1 class="text-4xl font-bold mb-4 text-gray-900 dark:text-white">
      {{ post.titulo }}
    </h1>

    <div class="mb-6">
      <small class="text-gray-500 dark:text-gray-400">
        Por {{ post.autor }} • Publicado em {{ post.data }}
      </small>
    </div>

    <div class="prose dark:prose-invert max-w-none mb-8">
      <p
        class="text-gray-700 dark:text-gray-300 text-lg leading-relaxed whitespace-pre-wrap"
      >
        {{ post.conteudo }}
      </p>
    </div>

    <hr class="my-6 border-gray-200 dark:border-gray-700" />

    <div class="flex gap-4 flex-wrap">
      <a
        href="/editar/{{ post.id }}"
        class="bg-yellow-500 dark:bg-yellow-600 text-white px-6 py-2 rounded-lg hover:bg-yellow-600 dark:hover:bg-yellow-700 font-semibold"
      >
        ✏️ Editar Post
      </a>

      <form
        action="/deletar/{{ post.id }}"
        method="POST"
        onsubmit="return confirm('Tem certeza que deseja deletar este post?')"
        class="inline"
      >
        <button
          type="submit"
          class="bg-red-600 dark:bg-red-700 text-white px-6 py-2 rounded-lg hover:bg-red-700 dark:hover:bg-red-800 font-semibold"
        >
          🗑️ Deletar Post
        </button>
      </form>

      <a
        href="/"
        class="bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 px-6 py-2 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 font-semibold"
      >
        ← Voltar para Home
      </a>
    </div>
  </article>
</div>
{% endblock %}
